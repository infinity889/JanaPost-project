services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jana-address-backend
    ports:
      - "8000:8000"
    environment:
      - GAZETTEER_DB_PATH=/app/data/kaz_geo.sqlite
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jana-address-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
